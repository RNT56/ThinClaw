# Automated dependency updates (refactor backlog D5 — dependency-update automation).
#
# Covers every committed Cargo lock graph, the desktop frontend's npm tree, and
# CI actions. The extension-root section is generated from registry source
# metadata and verified by scripts/ci/extension_registry.py so a new downloadable
# package cannot silently escape dependency updates.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/apps/desktop/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      desktop-backend-minor-patch:
        update-types:
          - minor
          - patch
    # The backend lockfile traverses the root workspace and the vendored
    # libSQL 0.6 patch. Root dependencies are updated by the entry above; the
    # patch internals must move only with an intentional libSQL migration.
    ignore:
      - dependency-name: bincode
      - dependency-name: fs4
      - dependency-name: http
      - dependency-name: libloading
      - dependency-name: libsql-sys
      - dependency-name: libsql_replication
      - dependency-name: tonic

  - package-ecosystem: npm
    directory: "/apps/desktop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # BEGIN GENERATED EXTENSION CARGO ROOTS — scripts/ci/extension_registry.py
