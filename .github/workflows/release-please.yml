name: Release Please

on:
  workflow_dispatch:
    inputs:
      recover_tag:
        description: Existing draft tag whose core artifact build should be recovered
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release PR or recover draft release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A GitHub App token is required because this repository intentionally
      # keeps the broad "Actions may create and approve pull requests" switch
      # disabled. App-created release PRs still receive normal protected CI.
      - name: Mint release automation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Prepare release PR or create draft release
        id: release
        if: inputs.recover_tag == ''
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Record release PR gate
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          number="$(jq -r '.number // empty' <<<"$RELEASE_PR")"
          branch="$(jq -r '.headBranchName // empty' <<<"$RELEASE_PR")"
          test -n "$number"
          test -n "$branch"
          {
            echo "### Release PR #$number"
            echo
            echo "Protected pull-request CI is running for \`$branch\`."
            echo "Merge only after its required checks pass."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve normal or recovery tag
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPLICIT_RECOVERY_TAG: ${{ inputs.recover_tag }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: |
          set -euo pipefail
          tag="${EXPLICIT_RECOVERY_TAG:-${CREATED_TAG:-}}"

          # Release Please can create a draft and then fail while performing a
          # later API operation. Recover that exact current-version draft only;
          # never guess among public or unrelated releases.
          if [[ -z "$tag" && "$RELEASE_OUTCOME" == "failure" ]]; then
            expected="v$(jq -r '.["."]' .release-please-manifest.json)"
            if draft="$(gh release view "$expected" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName 2>/dev/null)" \
              && [[ "$(jq -r '.isDraft' <<<"$draft")" == "true" ]]; then
              tag="$expected"
            fi
          fi

          if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid core release recovery tag: $tag"
            exit 1
          fi
          if [[ "$RELEASE_OUTCOME" == "failure" && -z "$tag" ]]; then
            echo "::error::Release Please failed and no exact draft release was recoverable"
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch staged core release
        if: steps.resolve.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f tag="$RELEASE_TAG" \
            -f mode=publish \
            -f promote_latest=true
