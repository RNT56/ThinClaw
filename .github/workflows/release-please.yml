name: Release Please

on:
  workflow_dispatch:
    inputs:
      recover_tag:
        description: Existing draft tag whose core artifact build should be recovered
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release PR or recover draft release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A GitHub App token is required because this repository intentionally
      # keeps the broad "Actions may create and approve pull requests" switch
      # disabled. App-created release PRs still receive normal protected CI.
      - name: Mint release automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Prepare release PR or create draft release
        id: release
        if: inputs.recover_tag == ''
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Record release PR gate
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          number="$(jq -r '.number // empty' <<<"$RELEASE_PR")"
          branch="$(jq -r '.headBranchName // empty' <<<"$RELEASE_PR")"
          test -n "$number"
          test -n "$branch"
          {
            echo "### Release PR #$number"
            echo
            echo "Protected pull-request CI is running for \`$branch\`."
            echo "Merge only after its required checks pass."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve normal or recovery tag
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPLICIT_RECOVERY_TAG: ${{ inputs.recover_tag }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: |
          set -euo pipefail
          tag="${EXPLICIT_RECOVERY_TAG:-${CREATED_TAG:-}}"

          # Release Please can create a draft and then fail while performing a
          # later API operation. Recover that exact current-version draft only;
          # never guess among public or unrelated releases.
          if [[ -z "$tag" && "$RELEASE_OUTCOME" == "failure" ]]; then
            expected="v$(jq -r '.["."]' .release-please-manifest.json)"
            if draft="$(gh release view "$expected" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName 2>/dev/null)" \
              && [[ "$(jq -r '.isDraft' <<<"$draft")" == "true" ]]; then
              tag="$expected"
            fi
          fi

          if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid core release recovery tag: $tag"
            exit 1
          fi
          if [[ "$RELEASE_OUTCOME" == "failure" && -z "$tag" ]]; then
            echo "::error::Release Please failed and no exact draft release was recoverable"
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch staged core release
        if: steps.resolve.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f tag="$RELEASE_TAG" \
            -f mode=publish \
            -f promote_latest=true

  prepare-extension-registry:
    name: Prepare reproducible extension registry in release PR
    needs: release-please
    if: ${{ needs.release-please.outputs.release_pr != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Mint release automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout release PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ fromJSON(needs.release-please.outputs.release_pr).headBranchName }}
      - name: Select large isolated build storage
        shell: bash
        run: |
          set -euo pipefail
          if mountpoint -q /mnt; then
            build_root=/mnt/thinclaw-extension-release
            sudo install -d -o "$(id -u)" -g "$(id -g)" "$build_root"
          else
            build_root="$RUNNER_TEMP/thinclaw-extension-release"
            mkdir -p "$build_root"
          fi
          echo "EXTENSION_BUILD_ROOT=$build_root" >> "$GITHUB_ENV"
          df -h "$build_root"
      - name: Install pinned Rust and WASI target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.94.0
          targets: wasm32-wasip2
      - name: Install exact component builder
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/ci/extension_registry.py tool-version)"
          cargo install cargo-component --version "$version" --locked
          [[ "$(cargo component --version | awk '{print $NF}')" == "$version" ]]
      - name: Build two clean extension bundle sets
        env:
          THINCLAW_EXTENSION_BUILD_ONLY: "1"
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$EXTENSION_BUILD_ROOT/target-first" \
            scripts/ci/build_extension_bundles.sh "$EXTENSION_BUILD_ROOT/bundles-first"
          CARGO_TARGET_DIR="$EXTENSION_BUILD_ROOT/target-second" \
            scripts/ci/build_extension_bundles.sh "$EXTENSION_BUILD_ROOT/bundles-second"
      - name: Compare clean builds and prepare future-version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/extension_registry.py compare-bundles \
            --first "$EXTENSION_BUILD_ROOT/bundles-first" \
            --second "$EXTENSION_BUILD_ROOT/bundles-second"
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          python3 scripts/ci/extension_registry.py prepare \
            --tag "v$version" \
            --bundles "$EXTENSION_BUILD_ROOT/bundles-first"
          python3 scripts/ci/extension_registry.py check-policy --expected-tag "v$version"
      - name: Commit prepared metadata to the release PR
        env:
          RELEASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.release_pr).headBranchName }}
        shell: bash
        run: |
          set -euo pipefail
          git add registry release/extension-registry.json
          if git diff --cached --quiet; then
            echo "Extension registry is already prepared for this release."
            exit 0
          fi
          git config user.name "thinclaw-release-app[bot]"
          git config user.email "thinclaw-release-app[bot]@users.noreply.github.com"
          git commit -m "chore(release): prepare extension registry"
          git push origin "HEAD:$RELEASE_BRANCH"
