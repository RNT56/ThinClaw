name: Release Credential Gate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      head_sha:
        description: Release PR head commit to receive the credential status
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  release-credentials:
    name: Publish release credential status
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
      RELEASE_BRANCH: release-please--branches--main--components--thinclaw
    steps:
      # workflow_run executes this definition from the default branch and does
      # not check out pull-request code. That keeps release secrets outside the
      # control of the commit whose status is being published.
      - name: Resolve pull request target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Invalid target commit SHA'
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            pulls="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls")"
            branch="$(jq -r --arg sha "$HEAD_SHA" \
              '[.[] | select(.state == "open" and .base.ref == "main" and .head.sha == $sha)][0].head.ref // empty' \
              <<<"$pulls")"
            repository="$(jq -r --arg sha "$HEAD_SHA" \
              '[.[] | select(.state == "open" and .base.ref == "main" and .head.sha == $sha)][0].head.repo.full_name // empty' \
              <<<"$pulls")"
          else
            branch="$EVENT_HEAD_BRANCH"
            repository="$EVENT_HEAD_REPOSITORY"
          fi

          if [[ -z "$branch" || -z "$repository" ]]; then
            echo '::error::Target commit is not the head of an open pull request into main'
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Validate release credentials
        id: gate
        env:
          HEAD_BRANCH: ${{ steps.target.outputs.branch }}
          HEAD_REPOSITORY: ${{ steps.target.outputs.repository }}
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          THINCLAW_GOOGLE_CLIENT_ID: ${{ secrets.THINCLAW_GOOGLE_CLIENT_ID }}
          THINCLAW_GOOGLE_CLIENT_SECRET: ${{ secrets.THINCLAW_GOOGLE_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          state=success
          description="Not a Release Please pull request"

          if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && "$HEAD_BRANCH" == "$RELEASE_BRANCH" ]]; then
            state=failure
            description="Core release automation credentials are not ready"

            required=(
              RELEASE_APP_ID
              RELEASE_APP_PRIVATE_KEY
            )
            missing=()
            for name in "${required[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                missing+=("$name")
              fi
            done

            if (( ${#missing[@]} > 0 )); then
              printf '::error::Missing required release secret: %s\n' "${missing[@]}"
            else
              invalid=0

              if [[ ( -n "$THINCLAW_GOOGLE_CLIENT_ID" && -z "$THINCLAW_GOOGLE_CLIENT_SECRET" ) \
                || ( -z "$THINCLAW_GOOGLE_CLIENT_ID" && -n "$THINCLAW_GOOGLE_CLIENT_SECRET" ) ]]; then
                echo '::error::Optional ThinClaw Google OAuth credentials must both be configured or both be absent'
                invalid=1
              elif [[ "$THINCLAW_GOOGLE_CLIENT_ID" =~ [[:space:]] \
                || "$THINCLAW_GOOGLE_CLIENT_SECRET" =~ [[:space:]] ]]; then
                echo '::error::Optional ThinClaw Google OAuth credentials must not contain whitespace'
                invalid=1
              fi

              if [[ ! "$RELEASE_APP_ID" =~ ^[0-9]+$ ]]; then
                echo '::error::RELEASE_APP_ID must be numeric'
                invalid=1
              fi
              if [[ "$RELEASE_APP_PRIVATE_KEY" != *'-----BEGIN '*'PRIVATE KEY-----'* \
                || "$RELEASE_APP_PRIVATE_KEY" != *'-----END '*'PRIVATE KEY-----'* ]]; then
                echo '::error::RELEASE_APP_PRIVATE_KEY must be a PEM private key'
                invalid=1
              fi

              if (( invalid == 0 )); then
                state=success
                description="Core release App and optional OAuth pair are ready"
              fi
            fi
          fi

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"

      - name: Publish Release Credentials status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.gate.outputs.state || 'error' }}
          DESCRIPTION: ${{ steps.gate.outputs.description || 'Release credential validation did not complete' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid target commit SHA"
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --raw-field state="$STATE" \
            --raw-field context='Release Credentials' \
            --raw-field description="$DESCRIPTION" \
            --raw-field target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
