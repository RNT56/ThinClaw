#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"
  "packages": "write"

concurrency:
  group: core-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_REF: ${{ inputs.tag || github.ref }}

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      mode:
        description: Publish normally, backfill an exact existing tag, or only validate the plan
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
          - backfill
      promote_latest:
        description: Promote GitHub/GHCR latest only after the versioned release verifies
        required: true
        default: false
        type: boolean

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ inputs.tag || github.ref_name }}
      tag-flag: ${{ format('--tag={0}', inputs.tag || github.ref_name) }}
      publishing: ${{ steps.contract.outputs.publishing }}
      mode: ${{ steps.contract.outputs.mode }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
      promote_latest: ${{ steps.contract.outputs.promote_latest }}
      source_commit: ${{ steps.contract.outputs.source_commit }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - name: Checkout immutable release-control tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-control
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - name: Resolve immutable release contract
        id: contract
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_MODE: ${{ inputs.mode }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
        run: |
          set -euo pipefail
          root_version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          args=(
            plan
            --tag "$RELEASE_TAG"
            --mode "$RELEASE_MODE"
            --root-version "$root_version"
          )
          if [[ "$PROMOTE_LATEST" == "true" ]]; then
            args+=(--promote-latest)
          fi
          python3 .release-control/scripts/ci/release_control.py "${args[@]}" > release-plan.json
          if [[ "$RELEASE_TAG" == "v0.16.0" ]]; then
            echo "Legacy extension registry policy is grandfathered only for the exact v0.16.0 backfill."
          else
            python3 .release-control/scripts/ci/extension_registry.py \
              --repo-root "$GITHUB_WORKSPACE" check-policy --expected-tag "$RELEASE_TAG"
          fi
          jq -r 'to_entries[] | "\(.key)=\(.value)"' release-plan.json >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --exit-code
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist host --steps=create --tag=${{ inputs.tag || github.ref_name }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  windows-runtime-smoke:
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.94.0
      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: windows-release-smoke
      - name: Host runtime smoke
        run: cargo test --locked --features full --bin thinclaw --test host_runtime_smoke run_no_onboard_binds_gateway_port_zero -- --nocapture

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Wait for WASM extensions so we can patch manifests with SHA256 checksums
    # before build.rs bakes them into the embedded catalog.
    needs:
      - plan
      - build-wasm-extensions
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') && (needs.build-wasm-extensions.result == 'skipped' || needs.build-wasm-extensions.result == 'success') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - name: Configure optional built-in Google OAuth client
        shell: bash
        env:
          THINCLAW_RELEASE_GOOGLE_CLIENT_ID: ${{ secrets.THINCLAW_GOOGLE_CLIENT_ID }}
          THINCLAW_RELEASE_GOOGLE_CLIENT_SECRET: ${{ secrets.THINCLAW_GOOGLE_CLIENT_SECRET }}
        run: bash scripts/ci/configure-google-oauth-build.sh
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ join(matrix.targets, '-') }}
          cache-provider: ${{ matrix.cache_provider }}
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Apply the exact v0.16.0 registry backfill compatibility layer
        if: ${{ needs.plan.outputs.tag == 'v0.16.0' }}
        shell: bash
        run: |
          set -euo pipefail
          checksums=target/distrib/checksums-wasm.txt
          test -s "$checksums"
          while read -r sha256 filename; do
            name="${filename%-wasm32-wasip2.tar.gz}"
            matched=0
            for manifest in registry/tools/*.json registry/channels/*.json; do
              if [[ "$(jq -r '.name' "$manifest")" == "$name" ]]; then
                jq --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.16.0/${filename}" \
                  --arg sha "$sha256" \
                  '.artifacts["wasm32-wasip2"] = {url: $url, sha256: $sha}' \
                  "$manifest" > "${manifest}.tmp"
                mv "${manifest}.tmp" "$manifest"
                matched=$((matched + 1))
              fi
            done
            [[ "$matched" -eq 1 ]]
          done < "$checksums"
          [[ "$(wc -l < "$checksums" | tr -d ' ')" -eq 28 ]]
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Build WASM extension bundles (tar.gz with .wasm + .capabilities.json)
  build-wasm-extensions:
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: "ubuntu-22.04"
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - name: Checkout immutable extension release tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-control
      - name: Select large isolated build storage
        shell: bash
        run: |
          set -euo pipefail
          mountpoint -q /mnt || {
            echo "The reproducibility job requires the hosted runner's large /mnt volume" >&2
            exit 1
          }
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/thinclaw-extension-release
          echo "EXTENSION_BUILD_ROOT=/mnt/thinclaw-extension-release" >> "$GITHUB_ENV"
          df -h /mnt
      - name: Install Rust toolchain + wasm target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.94.0
          targets: wasm32-wasip2
      - name: Install exact component builder
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 .release-control/scripts/ci/extension_registry.py tool-version)"
          cargo install cargo-component --version "$version" --locked
          [[ "$(cargo component --version | awk '{print $NF}')" == "$version" ]]
      - name: Build two clean reproducibility candidates
        env:
          THINCLAW_REPO_ROOT: ${{ github.workspace }}
          THINCLAW_EXTENSION_CHECKER: ${{ github.workspace }}/.release-control/scripts/ci/extension_registry.py
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == "v0.16.0" ]]; then
            CARGO_TARGET_DIR="$EXTENSION_BUILD_ROOT/target-first" \
              THINCLAW_LEGACY_UNLOCKED=1 THINCLAW_EXTENSION_BUILD_ONLY=1 \
              .release-control/scripts/ci/build_extension_bundles.sh \
              "$EXTENSION_BUILD_ROOT/bundles-first"
          else
            CARGO_TARGET_DIR="$EXTENSION_BUILD_ROOT/target-first" \
              .release-control/scripts/ci/build_extension_bundles.sh \
              "$EXTENSION_BUILD_ROOT/bundles-first"
            CARGO_TARGET_DIR="$EXTENSION_BUILD_ROOT/target-second" \
              .release-control/scripts/ci/build_extension_bundles.sh \
              "$EXTENSION_BUILD_ROOT/bundles-second"
          fi
      - name: Compare clean outputs and committed registry hashes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == "v0.16.0" ]]; then
            echo "Skipping strict source/hash comparison for the exact legacy v0.16.0 backfill."
          else
            python3 .release-control/scripts/ci/extension_registry.py \
              --repo-root "$GITHUB_WORKSPACE" compare-bundles \
              --first "$EXTENSION_BUILD_ROOT/bundles-first" \
              --second "$EXTENSION_BUILD_ROOT/bundles-second"
            python3 .release-control/scripts/ci/extension_registry.py \
              --repo-root "$GITHUB_WORKSPACE" verify-bundles \
              --tag "$RELEASE_TAG" \
              --bundles "$EXTENSION_BUILD_ROOT/bundles-first"
          fi
          mkdir -p target/wasm-bundles
          cp "$EXTENSION_BUILD_ROOT"/bundles-first/* target/wasm-bundles/
      - name: "Upload WASM bundles"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-wasm-extensions
          path: |
            target/wasm-bundles/*.tar.gz
            target/wasm-bundles/checksums-wasm.txt
          if-no-files-found: error

  # ── Container image pipeline ───────────────────────────────────────────
  # Instead of compiling Rust inside Docker (which hangs under QEMU for
  # ARM64), we download the pre-built binaries from cargo-dist artifacts
  # and package them into lightweight Debian images.
  #
  # Architecture images are exported to workflow storage first. No registry
  # tag changes until every release asset has passed the contract and the
  # protected production environment approves staging.

  build-container-amd64:
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_BUILD_SUMMARY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - name: Download pre-built amd64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-build-local-x86_64-unknown-linux-gnu*
          path: target/distrib/
          merge-multiple: true
      - name: Extract binary from dist archive
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find target/distrib/ -name '*x86_64-unknown-linux-gnu*.tar.gz' -not -name '*dist-manifest*' | head -1)
          if [ -z "$archive" ]; then
            echo "::error::No x86_64 linux archive found in artifacts"
            ls -laR target/distrib/
            exit 1
          fi
          echo "Extracting binary from: $archive"
          tar xzf "$archive" --wildcards '*/thinclaw' --strip-components=1
          chmod +x thinclaw
          file thinclaw
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build staged amd64 OCI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: mode=max
          sbom: true
          build-args: |
            THINCLAW_BINARY=thinclaw
          tags: thinclaw:${{ needs.plan.outputs.tag }}-amd64
          outputs: type=oci,dest=/tmp/thinclaw-container-amd64.tar
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,mode=max,scope=container-amd64
      - name: Upload staged amd64 OCI image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staged-container-amd64
          path: /tmp/thinclaw-container-amd64.tar
          if-no-files-found: error

  build-container-arm64:
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_BUILD_SUMMARY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - name: Download pre-built arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-build-local-aarch64-unknown-linux-gnu*
          path: target/distrib/
          merge-multiple: true
      - name: Extract binary from dist archive
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find target/distrib/ -name '*aarch64-unknown-linux-gnu*.tar.gz' -not -name '*dist-manifest*' | head -1)
          if [ -z "$archive" ]; then
            echo "::error::No aarch64 linux archive found in artifacts"
            ls -laR target/distrib/
            exit 1
          fi
          echo "Extracting binary from: $archive"
          tar xzf "$archive" --wildcards '*/thinclaw' --strip-components=1
          chmod +x thinclaw
          file thinclaw
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build staged arm64 OCI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          provenance: mode=max
          sbom: true
          build-args: |
            THINCLAW_BINARY=thinclaw
          tags: thinclaw:${{ needs.plan.outputs.tag }}-arm64
          outputs: type=oci,dest=/tmp/thinclaw-container-arm64.tar
          cache-from: type=gha,scope=container-arm64
          cache-to: type=gha,mode=max,scope=container-arm64
      - name: Upload staged arm64 OCI image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staged-container-arm64
          path: /tmp/thinclaw-container-arm64.tar
          if-no-files-found: error

  publish-container-manifest:
    needs:
      - plan
      - build-container-amd64
      - build-container-arm64
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download staged OCI images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: staged-container-*
          path: staged-containers
          merge-multiple: true
      - name: Verify staged OCI image archives
        shell: bash
        run: |
          set -euo pipefail
          test -s staged-containers/thinclaw-container-amd64.tar
          test -s staged-containers/thinclaw-container-arm64.tar
          tar -tf staged-containers/thinclaw-container-amd64.tar | grep -qx index.json
          tar -tf staged-containers/thinclaw-container-arm64.tar | grep -qx index.json
          shasum -a 256 staged-containers/*.tar > staged-containers/checksums-containers.txt
      - name: Upload staged container inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staged-container-inventory
          path: staged-containers/checksums-containers.txt
          if-no-files-found: error

  # Apple delivery is intentionally outside the core release contract until
  # the separately tracked 0.2.0 signing milestone. Keep the implementation
  # visible for that lane, but a core release can never invoke it.
  build-desktop-macos:
    needs:
      - plan
    if: ${{ github.event_name == 'workflow_call' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      THINCLAW_DESKTOP_ENGINE: mlx
      TAURI_TARGET_TRIPLE: aarch64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - name: Configure optional built-in Google OAuth client
        shell: bash
        env:
          THINCLAW_RELEASE_GOOGLE_CLIENT_ID: ${{ secrets.THINCLAW_GOOGLE_CLIENT_ID }}
          THINCLAW_RELEASE_GOOGLE_CLIENT_SECRET: ${{ secrets.THINCLAW_GOOGLE_CLIENT_SECRET }}
        run: bash scripts/ci/configure-google-oauth-build.sh
      - name: Require production signing and notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Desktop release secrets: ${missing[*]}"
            exit 1
          fi
      - name: Resolve and verify release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop releases require a v-prefixed SemVer tag: $RELEASE_TAG"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          root_version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ "$version" != "$root_version" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match root package version $root_version"
            exit 1
          fi
          echo "TAURI_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "TAURI_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.94.0
      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: desktop-release-macos-arm64
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Import Developer ID Application certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/thinclaw-certificate.p12"
          keychain="$RUNNER_TEMP/thinclaw-build.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          cert_info="$(security find-identity -v -p codesigning "$keychain" | grep '"Developer ID Application:' | head -1 || true)"
          if [[ -z "$cert_info" ]]; then
            echo "::error::Imported certificate does not contain a Developer ID Application identity"
            exit 1
          fi
          signing_identity="$(printf '%s\n' "$cert_info" | awk -F'"' '{print $2}')"
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "THINCLAW_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          rm -f "$certificate"
      - name: Install verified Desktop runtime assets
        working-directory: apps/desktop
        run: |
          test "$(uname -m)" = "arm64"
          npm run setup:all
      - name: Validate Desktop packaging contract
        working-directory: apps/desktop
        run: npm run validate:packaging
      - name: Build, sign, notarize, and staple Desktop
        working-directory: apps/desktop
        env:
          INCLUDE_CHROMIUM: "1"
        run: npm run tauri:build:mlx
      - name: Verify installed MLX bootstrap assets
        working-directory: apps/desktop
        run: bash scripts/verify_macos_mlx_bundle.sh backend/target/release/bundle/macos
      - name: Verify and collect signed Desktop artifacts
        working-directory: apps/desktop
        env:
          VERIFY_APPLE_ARTIFACTS: "1"
        run: bash scripts/collect_macos_release_artifacts.sh
      - name: Upload notarized Desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-desktop-macos
          path: apps/desktop/backend/target/release-artifacts/*
          if-no-files-found: error
      - name: Remove ephemeral signing keychain
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${THINCLAW_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$THINCLAW_RELEASE_KEYCHAIN" || true
          fi

  # Assemble the explicit non-Apple contract, then stage it behind a protected
  # environment. A failure before this point has made no public release or
  # stable registry mutation.
  host:
    name: Stage validated core release draft
    needs:
      - plan
      - windows-runtime-smoke
      - build-local-artifacts
      - build-global-artifacts
      - build-wasm-extensions
      - publish-container-manifest
      - publish-edge-checksums
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.windows-runtime-smoke.result == 'success' && needs.build-global-artifacts.result == 'success' && needs.build-local-artifacts.result == 'success' && needs.build-wasm-extensions.result == 'success' && needs.publish-container-manifest.result == 'success' && needs.publish-edge-checksums.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    environment: release-production
    outputs:
      asset-count: ${{ steps.assemble.outputs.asset_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - name: Checkout immutable release-control tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-control
      - name: Download all staged release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/release-input/
          merge-multiple: true
      - name: Assemble and validate core release contract
        id: assemble
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          python3 .release-control/scripts/ci/release_control.py assemble \
            --source target/release-input \
            --output target/release-assets \
            --tag "$RELEASE_TAG" \
            --contract .release-control/release/non-apple-assets.json > release-assembly.json
          echo "asset_count=$(jq -r '.asset_count' release-assembly.json)" >> "$GITHUB_OUTPUT"
          {
            echo "## Core release $RELEASE_TAG"
            echo
            echo "This release contains the verified CLI, edge, Windows, container, and WASM-extension outputs."
            echo "Signed Apple Desktop and iOS delivery are intentionally managed by the separate 0.2.0 release lane."
          } > "$RUNNER_TEMP/release-notes.md"
      - name: Upload validated release assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staged-core-release-assets
          path: target/release-assets/*
          if-no-files-found: error
      - name: Stage immutable draft assets
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_MODE: ${{ needs.plan.outputs.mode }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.source_commit }}
          RELEASE_ASSET_DIR: target/release-assets
          RELEASE_TITLE: ThinClaw ${{ needs.plan.outputs.tag }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_CONTRACT: ${{ github.workspace }}/.release-control/release/non-apple-assets.json
        run: bash .release-control/scripts/ci/stage_release_assets.sh

  build-edge-artifacts:
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - name: Configure optional built-in Google OAuth client
        shell: bash
        env:
          THINCLAW_RELEASE_GOOGLE_CLIENT_ID: ${{ secrets.THINCLAW_GOOGLE_CLIENT_ID }}
          THINCLAW_RELEASE_GOOGLE_CLIENT_SECRET: ${{ secrets.THINCLAW_GOOGLE_CLIENT_SECRET }}
        run: bash scripts/ci/configure-google-oauth-build.sh
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: edge-${{ matrix.target }}
      - name: Install musl toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" != *-musl ]]; then
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y musl-tools

          musl_gcc="$(command -v musl-gcc)"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              if ! command -v x86_64-linux-musl-gcc >/dev/null 2>&1; then
                sudo ln -sf "$musl_gcc" /usr/local/bin/x86_64-linux-musl-gcc
              fi
              ;;
            aarch64-unknown-linux-musl)
              if ! command -v aarch64-linux-musl-gcc >/dev/null 2>&1; then
                sudo ln -sf "$musl_gcc" /usr/local/bin/aarch64-linux-musl-gcc
              fi
              ;;
          esac
      - name: Build edge binary
        run: cargo build --locked --release --no-default-features --features edge --bin thinclaw --target ${{ matrix.target }}
      - name: Package edge artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/edge-artifacts/package
          cp "target/${{ matrix.target }}/release/thinclaw" target/edge-artifacts/package/thinclaw
          chmod +x target/edge-artifacts/package/thinclaw
          archive="thinclaw-edge-${{ matrix.target }}.tar.gz"
          tar -C target/edge-artifacts/package -czf "target/edge-artifacts/${archive}" thinclaw
          sha256sum "target/edge-artifacts/${archive}" | awk -v f="$archive" '{print $1 "  " f}' >> target/edge-artifacts/checksums-edge.txt
          if [[ "${{ matrix.target }}" == *-musl ]]; then
            if ldd target/edge-artifacts/package/thinclaw >/tmp/thinclaw-edge-ldd.txt 2>&1 && ! grep -qi "statically linked" /tmp/thinclaw-edge-ldd.txt; then
              cat /tmp/thinclaw-edge-ldd.txt
              echo "::error::musl/static-ish artifact appears dynamically linked"
              exit 1
            fi
            cat /tmp/thinclaw-edge-ldd.txt || true
          fi
      - name: Upload staged edge artifact and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staged-edge-${{ matrix.target }}
          path: |
            target/edge-artifacts/thinclaw-edge-${{ matrix.target }}.tar.gz
            target/edge-artifacts/checksums-edge.txt
          if-no-files-found: error

  publish-edge-checksums:
    needs:
      - plan
      - build-edge-artifacts
    if: ${{ always() && needs.build-edge-artifacts.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download staged edge artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: staged-edge-*
          path: target/edge-downloads
      - name: Consolidate edge checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/edge-artifacts
          find target/edge-downloads -name 'thinclaw-edge-*.tar.gz' -exec cp {} target/edge-artifacts/ \;
          find target/edge-downloads -name checksums-edge.txt -exec cat {} + \
            | sort -u -k2 > target/edge-artifacts/checksums-edge-merged.txt
          test "$(wc -l < target/edge-artifacts/checksums-edge-merged.txt | tr -d ' ')" -eq 4
      - name: Upload consolidated staged edge artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-edge-release
          path: |
            target/edge-artifacts/thinclaw-edge-*.tar.gz
            target/edge-artifacts/checksums-edge-merged.txt
          if-no-files-found: error

  publish-container-images:
    name: Publish immutable versioned container
    needs:
      - plan
      - host
      - build-container-amd64
      - build-container-arm64
    if: ${{ always() && needs.host.result == 'success' && needs.build-container-amd64.result == 'success' && needs.build-container-arm64.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download staged OCI images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: staged-container-*
          path: staged-containers
          merge-multiple: true
      - name: Install registry transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version only after draft staging
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          MODE: ${{ needs.plan.outputs.mode }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if docker buildx imagetools inspect "$image:$TAG" >/dev/null 2>&1; then
            if [[ "$MODE" == "backfill" ]]; then
              docker buildx imagetools inspect "$image:$TAG" > existing-container.json
              grep -q 'linux/amd64' existing-container.json
              grep -q 'linux/arm64' existing-container.json
              echo "Versioned container $image:$TAG already exists; preserving its immutable digest."
              exit 0
            fi
            echo "::error::Versioned container $image:$TAG already exists; refusing to overwrite it"
            exit 1
          fi

          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          amd_candidate="$image:${TAG}-candidate-${GITHUB_RUN_ID}-amd64"
          arm_candidate="$image:${TAG}-candidate-${GITHUB_RUN_ID}-arm64"
          skopeo copy --all "oci-archive:staged-containers/thinclaw-container-amd64.tar" "docker://$amd_candidate"
          skopeo copy --all "oci-archive:staged-containers/thinclaw-container-arm64.tar" "docker://$arm_candidate"
          docker buildx imagetools create --tag "$image:$TAG" "$amd_candidate" "$arm_candidate"
          docker buildx imagetools inspect "$image:$TAG" > versioned-container.json
          grep -q 'linux/amd64' versioned-container.json
          grep -q 'linux/arm64' versioned-container.json

  publish-release:
    name: Publish versioned GitHub release
    needs:
      - plan
      - host
      - publish-container-images
    if: ${{ always() && needs.host.result == 'success' && needs.publish-container-images.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Verify and publish draft without latest promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          EXPECTED_ASSETS: ${{ needs.host.outputs.asset-count }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          [[ "$(jq -r '.isDraft' <<<"$release")" == "true" ]]
          [[ "$(jq '.assets | length' <<<"$release")" == "$EXPECTED_ASSETS" ]]
          args=(--repo "$GITHUB_REPOSITORY" --draft=false --latest=false)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release edit "$TAG" "${args[@]}"
          [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == "false" ]]

  promote-stable:
    name: Promote verified stable aliases
    needs:
      - plan
      - publish-release
    if: ${{ always() && needs.publish-release.result == 'success' && needs.plan.outputs.promote_latest == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote GitHub latest then GHCR latest with rollback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          previous="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"

          rollback_latest() {
            if [[ -n "$previous" && "$previous" != "$TAG" ]]; then
              gh release edit "$previous" --repo "$GITHUB_REPOSITORY" --latest || true
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest=false || true
            fi
          }
          trap rollback_latest ERR

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          docker buildx imagetools create --tag "$image:latest" "$image:$TAG"
          version_digest="$(docker buildx imagetools inspect "$image:$TAG" | awk '/^Digest:/ {print $2; exit}')"
          latest_digest="$(docker buildx imagetools inspect "$image:latest" | awk '/^Digest:/ {print $2; exit}')"
          [[ -n "$version_digest" && "$version_digest" == "$latest_digest" ]]
          trap - ERR

  announce:
    needs:
      - plan
      - publish-release
      - promote-stable
    if: ${{ always() && needs.publish-release.result == 'success' && (needs.promote-stable.result == 'success' || needs.promote-stable.result == 'skipped') }}
    runs-on: "ubuntu-22.04"
    steps:
      - name: Record publication summary
        run: |
          {
            echo "## Published ${{ needs.plan.outputs.tag }}"
            echo
            echo "Core versioned assets and container manifest are public."
            echo "Stable aliases promoted: ${{ needs.plan.outputs.promote_latest }}"
            echo "Apple release artifacts: intentionally excluded"
          } >> "$GITHUB_STEP_SUMMARY"
