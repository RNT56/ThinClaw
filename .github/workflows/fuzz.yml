name: Fuzz
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_sanitizer
          - fuzz_leak_detector
          - fuzz_validator
          - fuzz_credential_detect
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Run fuzzer (5 min)
        run: cd fuzz && cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
